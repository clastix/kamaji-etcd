apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    {{- include "etcd.labels" . | nindent 4 }}
  name: {{ include "etcd.stsName" . }}
  namespace: {{ .Release.Namespace }}
spec:
  serviceName: {{ include "etcd.serviceName" . }}
  selector:
    matchLabels:
      {{- include "etcd.selectorLabels" . | nindent 6 }}
  replicas: {{ .Values.replicas }}
  {{- if .Values.persistentVolumeClaim.retentionPolicyWhenDeleted }}
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: {{ .Values.persistentVolumeClaim.retentionPolicyWhenDeleted }}
  {{- end }}
  template:
    metadata:
      name: etcd
      labels:
        {{- include "etcd.selectorLabels" . | nindent 8 }}
        {{- if .Values.podLabels }}
        {{- toYaml .Values.podLabels | nindent 8 }}
        {{- end }}
      annotations:
        {{- if .Values.podAnnotations }}
        {{- toYaml .Values.podAnnotations | nindent 8 }}
        {{- end }}      
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        {{- if .Values.certManager.enabled }}
        - name: certs
          projected:
            sources:
              - secret:
                  name: {{ include "etcd.certManager.serverCert" .  }}
                  items:
                    {{- if not .Values.certManager.caBundle.enabled }}
                    - key: ca.crt
                      path: ca.crt
                    {{- end }}
                    - key: tls.crt
                      path: server.pem
                    - key: tls.key
                      path: server-key.pem
              - secret:
                  name: {{ include "etcd.certManager.peerCert" .  }}
                  items:
                    - key: tls.crt
                      path: peer.pem
                    - key: tls.key
                      path: peer-key.pem
        {{- if .Values.certManager.caBundle.enabled }}
        - name: ca-bundle
          emptyDir: {}
        {{- end }}
        {{- else }}
        - name: certs
          secret:
            secretName: {{ include "etcd.caSecretName" . }}
        {{- end }}
      {{- if .Values.certManager.caBundle.enabled }}
      serviceAccountName: {{ include "etcd.caBundle.name" . }}
      initContainers:
        # Merges the CA sources into a single trusted-ca-file before etcd starts, reading them
        # through the Kubernetes API since they may live across namespaces: running in the Pod
        # rather than as a Helm hook Job avoids deadlocking `helm install --wait`.
        - name: ca-bundle
          image: {{ printf "%s:%s" .Values.certManager.caBundle.image.repository .Values.certManager.caBundle.image.tag }}
          imagePullPolicy: {{ .Values.certManager.caBundle.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: ca-bundle
              mountPath: /etc/etcd/ca-bundle
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              fetch() {
                ns="$1"; name="$2"; key="$3"
                key_escaped=$(printf '%s' "$key" | sed 's/\./\\./g')
                i=0
                while [ "$i" -lt 30 ]; do
                  if data=$(kubectl -n "$ns" get secret "$name" -o jsonpath="{.data['$key_escaped']}" 2>/dev/null) && [ -n "$data" ]; then
                    echo "$data" | base64 -d
                    echo
                    return 0
                  fi
                  echo "waiting for secret $ns/$name key $key to be populated ($i/30)..." >&2
                  i=$((i+1))
                  sleep 2
                done
                echo "timed out waiting for secret $ns/$name key $key" >&2
                return 1
              }
              : > /etc/etcd/ca-bundle/ca.crt.tmp
              {{- range (include "etcd.caBundle.sources" . | fromYamlArray) }}
              fetch {{ .namespace | default $.Release.Namespace | quote }} {{ .name | quote }} {{ .key | default "tls.crt" | quote }} >> /etc/etcd/ca-bundle/ca.crt.tmp
              {{- end }}
              mv /etc/etcd/ca-bundle/ca.crt.tmp /etc/etcd/ca-bundle/ca.crt
      {{- end }}
      containers:
        - name: etcd
          image: {{ include "etcd.fullyQualifiedDockerImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - containerPort: {{ .Values.clientPort }}
              name: client
            - containerPort: {{ .Values.peerApiPort }}
              name: peer
            - containerPort: {{ .Values.metricsPort }}
              name: metrics
          volumeMounts:
            - name: data
              mountPath: /var/run/etcd
            - name: certs
              mountPath: /etc/etcd/pki
            {{- if and .Values.certManager.enabled .Values.certManager.caBundle.enabled }}
            - name: ca-bundle
              mountPath: /etc/etcd/ca-bundle
              readOnly: true
            {{- end }}
          command:
            - etcd
            - --data-dir=/var/run/etcd
            - --name=$(POD_NAME)
            - --initial-cluster-state=new
            - --initial-cluster={{ include "etcd.initialCluster" . }}
            - --initial-advertise-peer-urls=https://$(POD_NAME).{{ include "etcd.serviceName" . }}.$(POD_NAMESPACE).svc.{{ .Values.clusterDomain }}:{{ .Values.peerApiPort }}
            - --advertise-client-urls=https://$(POD_NAME).{{ include "etcd.serviceName" . }}.$(POD_NAMESPACE).svc.{{ .Values.clusterDomain }}:{{ .Values.clientPort }}
            - --initial-cluster-token=kamaji
            - --listen-client-urls=https://0.0.0.0:{{ .Values.clientPort }}
            - --listen-metrics-urls=http://0.0.0.0:{{ .Values.metricsPort }}
            - --listen-peer-urls=https://0.0.0.0:{{ .Values.peerApiPort }}
            - --client-cert-auth=true
            - --peer-client-cert-auth=true
            - --trusted-ca-file={{ include "etcd.trustedCAFile" . }}
            - --cert-file=/etc/etcd/pki/server.pem
            - --key-file=/etc/etcd/pki/server-key.pem
            - --peer-trusted-ca-file={{ include "etcd.trustedCAFile" . }}
            - --peer-cert-file=/etc/etcd/pki/peer.pem
            - --peer-key-file=/etc/etcd/pki/peer-key.pem
            - --auto-compaction-mode={{ .Values.autoCompactionMode }}
            - --auto-compaction-retention={{ .Values.autoCompactionRetention }}
            - --snapshot-count={{ .Values.snapshotCount }}
            - --quota-backend-bytes={{ .Values.quotaBackendBytes }}
            {{- with .Values.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      priorityClassName: {{- toYaml .Values.priorityClassName | nindent 8 }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
      {{- toYaml .Values.podSecurityContext | nindent 8 }}
  volumeClaimTemplates:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: data
        {{- with .Values.persistentVolumeClaim.customAnnotations }}
        annotations:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      spec:
        storageClassName: {{ .Values.persistentVolumeClaim.storageClassName }}
        accessModes:
        {{- range .Values.persistentVolumeClaim.accessModes }}
        - {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistentVolumeClaim.size }}
